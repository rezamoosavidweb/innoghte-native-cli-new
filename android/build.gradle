buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// AGP 8.12 asks library annotation-extraction for unpublished lint 31.12.0
// artifacts. This publishing-only task is not needed by the debug application.
subprojects { subproject ->
    def debugTypedefFile = subproject.layout.buildDirectory.file(
        "intermediates/annotations_typedef_file/debug/extractDebugAnnotations/typedefs.txt"
    )
    def prepareDebugTypedefs = subproject.tasks.register("prepareDebugTypedefs") {
        outputs.file(debugTypedefFile)
        doLast {
            def output = debugTypedefFile.get().asFile
            output.parentFile.mkdirs()
            output.text = ""
        }
    }
    subproject.tasks.configureEach { task ->
        if (task.name == "extractDebugAnnotations") {
            task.enabled = false
        }
        if (task.name == "syncDebugLibJars") {
            task.dependsOn(prepareDebugTypedefs)
        }
    }
}


apply plugin: "com.facebook.react.rootproject"
